name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck and ruff
        run: sudo apt-get update && sudo apt-get install -y lua-check && pipx install ruff

      - name: Lint
        run: make lint
